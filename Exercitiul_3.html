<!DOCTYPE html>

  <title>Exercitiul 3</title>

<body>
  <script>
    let a = 19;
    let b = 20;
    let c = 21;

    let numere = [a, b, c];
    numere.sort(function(x, y) {
      return y - x; 
    });

    console.log(`Numerele în ordine descrescătoare sunt: ${numere.join(", ")}`);
  </script>
</body>
