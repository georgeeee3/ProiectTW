<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Exercitiul 2</title>
</head>
<body>
  <script>
    let tranzactie1 = true;
    let tranzactie2 = false;

    if (tranzactie1) {
      console.log("Tranzactie acceptata!");
    }

    if (tranzactie2) {
      console.log("Tranzactie acceptată!");
    } else {
      console.log("Tranzactie refuzată!");
    }

    
    // tranzactie1 = true se afișează mesajul de acceptare
    // tranzactie2 = false se execută else (refuz)
    // if verifică condiția; dacă e true rulează blocul if, altfel else
   
  </script>
</body>
</html>
