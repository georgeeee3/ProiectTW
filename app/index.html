<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Catalog Studenți</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 20px auto; }
        .container { background: #f9f9f9; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, select { padding: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button.add-btn { padding: 10px; background-color: #28a745; color: white; border: none; cursor: pointer; width: 100%; border-radius: 4px; font-size: 16px; }
        button.add-btn:hover { background-color: #218838; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Catalog Studenți</h2>
    
    <div class="container">
        <label>Nume Student:</label>
        <input type="text" id="nume" placeholder="Ex: Popescu Ion" required>

        <label>Anul de studiu:</label>
        <select id="an">
            <option value="1">Anul 1</option>
            <option value="2">Anul 2</option>
            <option value="3">Anul 3</option>
            <option value="4">Anul 4</option>
        </select>

        <label>Media generală:</label>
        <input type="number" id="media" placeholder="Ex: 9.50" step="0.01" required>

        <button class="add-btn" onclick="adaugaStudent()">Adaugă Student</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Nume</th>
                <th>An</th>
                <th>Media</th>
            </tr>
        </thead>
        <tbody id="lista"></tbody>
    </table>

    <script>
        function incarcaStudenti() {
            fetch('api.php')
                .then(res => res.json())
                .then(data => {
                    let html = '';
                    data.forEach(s => {
                        html += `
                        <tr>
                            <td>${s.nume}</td>
                            <td>Anul ${s.an}</td>
                            <td>${s.media}</td>
                        </tr>`;
                    });
                    document.getElementById('lista').innerHTML = html;
                });
        }

        function adaugaStudent() {
            const s = {
                nume: document.getElementById('nume').value,
                an: document.getElementById('an').value, 
                media: document.getElementById('media').value
            };
            
            if(!s.nume || !s.media) { alert("Completează toate câmpurile!"); return; }

            fetch('api.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(s)
            }).then(() => {
                incarcaStudenti();
                document.getElementById('nume').value = ''; 
                document.getElementById('media').value = '';
                document.getElementById('an').value = '1';
            });
        }
        
        incarcaStudenti();
    </script>
</body>
</html>
